<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none" aria-label="Global Villaje Media Logo Icon">
  <!-- Sprout Leaves on Top Right -->
  <!-- Main Stem -->
  <path d="M 122 45 Q 128 30 135 18" stroke="#084d3e" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  
  <!-- Right Leaf -->
  <path d="M 134 18 C 146 14 158 20 156 30 C 145 32 136 26 134 18 Z" fill="#78c932" stroke="#084d3e" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right Leaf Midrib -->
  <path d="M 136 21 Q 146 24 152 26" stroke="#084d3e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Leaf -->
  <path d="M 125 32 C 114 22 110 32 114 40 C 120 42 125 38 125 32 Z" fill="#78c932" stroke="#084d3e" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left Leaf Midrib -->
  <path d="M 122 34 Q 117 32 113 35" stroke="#084d3e" stroke-width="2" stroke-linecap="round"/>

  <!-- Globe / Earth Circle -->
  <!-- Ocean Background -->
  <circle cx="98" cy="85" r="48" fill="#60b5e8" stroke="#084d3e" stroke-width="5.5"/>

  <!-- Continents / Green Landmasses -->
  <!-- Top Landmass -->
  <path d="M 72 50 C 78 43 95 40 108 42 C 118 44 125 49 130 55 C 133 60 128 66 122 68 C 114 70 102 65 96 68 C 88 72 82 78 75 75 C 68 72 65 60 72 50 Z" fill="#78c932" stroke="#084d3e" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Lower-Left Landmass -->
  <path d="M 68 85 C 72 80 82 82 86 88 C 90 94 94 105 88 114 C 82 122 72 125 65 118 C 58 110 60 92 68 85 Z" fill="#78c932" stroke="#084d3e" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Middle-Right Landmass -->
  <path d="M 115 80 C 122 78 132 82 138 90 C 142 98 138 108 130 114 C 124 118 118 115 116 108 C 114 98 110 88 115 80 Z" fill="#78c932" stroke="#084d3e" stroke-width="4" stroke-linejoin="round"/>

  <!-- Nested Swirl Basket / Loops at Bottom -->
  <!-- Top Loop -->
  <ellipse cx="96" cy="115" rx="55" ry="14" fill="#ffffff" fill-opacity="0.2" stroke="#084d3e" stroke-width="5" transform="rotate(-6 96 115)"/>
  
  <!-- Middle Loop -->
  <ellipse cx="94" cy="132" rx="42" ry="11" fill="none" stroke="#084d3e" stroke-width="5" transform="rotate(-4 94 132)"/>
  
  <!-- Bottom Loop -->
  <ellipse cx="92" cy="146" rx="28" ry="8" fill="none" stroke="#084d3e" stroke-width="5" transform="rotate(-2 92 146)"/>
</svg>
